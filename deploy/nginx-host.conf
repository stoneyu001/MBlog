# ============================================
# 宿主机 Nginx 配置 — www.stoneyu.fun
# ============================================
# 部署位置: /etc/nginx/sites-available/www.stoneyu.fun
# 软链接:   /etc/nginx/sites-enabled/www.stoneyu.fun
#
# 此文件由 deploy.sh 自动部署，也可手动复制：
#   sudo cp nginx-host.conf /etc/nginx/sites-available/www.stoneyu.fun
#   sudo ln -sf /etc/nginx/sites-available/www.stoneyu.fun /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# ============================================

# HTTP → HTTPS 重定向
server {
    listen 80;
    listen [::]:80;
    server_name www.stoneyu.fun stoneyu.fun;

    # Certbot ACME 验证目录（续签时需要）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # 其余所有请求重定向到 HTTPS
    location / {
        return 301 https://www.stoneyu.fun$request_uri;
    }
}

# HTTPS 主配置
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.stoneyu.fun stoneyu.fun;

    # --- SSL 证书路径（由 certbot 管理）---
    ssl_certificate     /etc/letsencrypt/live/www.stoneyu.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.stoneyu.fun/privkey.pem;

    # --- SSL 安全配置 ---
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # --- HSTS（严格传输安全）---
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # --- 安全头 ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- 日志 ---
    access_log /var/log/nginx/www.stoneyu.fun.access.log;
    error_log  /var/log/nginx/www.stoneyu.fun.error.log;

    # --- 反向代理到 Docker 容器 ---
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 覆盖客户端传入的 X-Forwarded-For，建立可信代理链的第一跳。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 当前站点只有普通 HTTP 和静态资源，不启用 WebSocket Upgrade。
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;

        # 缓冲配置
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 4 64k;
        proxy_busy_buffers_size 128k;
    }
}
