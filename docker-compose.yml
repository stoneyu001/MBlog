services:
  # ============================================
  # PostgreSQL 数据库服务
  # ============================================
  db:
    image: postgres:15-alpine
    container_name: mblog_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
      LANG: C.UTF-8
    # 绑定到localhost,支持SSH隧道访问但不暴露到公网
    ports:
      - "127.0.0.1:${DB_PORT}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - mblog_network
    # 健康检查：确保数据库完全启动后再启动后端
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============================================
  # Go 后端 API 服务
  # ============================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mblog_backend
    restart: unless-stopped
    environment:
      # 数据库连接配置
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1,172.16.0.0/12}
      # 时区配置
      TZ: Asia/Shanghai
    # 生产环境安全建议：后端通过 Nginx 反向代理访问，无需暴露端口
    # 如需直接调试后端，可取消下面的注释
    # ports:
    #   - "${BACKEND_PORT}:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mblog_network

  # ============================================
  # Nginx 前端服务
  # ============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mblog_frontend
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports:
      # 仅供宿主机 Nginx 反向代理，避免绕过 HTTPS 直接访问。
      - "127.0.0.1:${FRONTEND_PORT}:80"
    depends_on:
      - backend
    networks:
      - mblog_network

# ============================================
# 数据卷定义
# ============================================
volumes:
  # PostgreSQL 数据持久化卷
  pg_data:
    driver: local

# ============================================
# 网络定义
# ============================================
networks:
  # 自定义网络，隔离服务
  mblog_network:
    driver: bridge
